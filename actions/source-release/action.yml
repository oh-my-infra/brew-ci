name: Source release
description: Validate CalVer, package reproducible sources, and create a GitHub Release

inputs:
  project-name:
    description: Lowercase project name used in the archive
    required: true
  version-file:
    description: File containing the canonical YYYY.MM.DD.N version
    required: false
    default: VERSION
  validate-command:
    description: Repository command that must pass before packaging
    required: true
  package-paths:
    description: Newline-separated repository-relative paths included in the archive
    required: true

outputs:
  version:
    description: Validated version without the v prefix
    value: ${{ steps.version.outputs.version }}
  tag:
    description: Published Git tag
    value: ${{ steps.version.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Read and validate version
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_FILE: ${{ inputs.version-file }}
      run: |
        set -euo pipefail
        version="$(tr -d '[:space:]' < "$VERSION_FILE")"
        python3 "$GITHUB_ACTION_PATH/../../scripts/validate_version.py" \
          "$version" --require-today
        tag="v$version"
        if gh release view "$tag" >/dev/null 2>&1; then
          echo "Release $tag already exists; bump $VERSION_FILE first." >&2
          exit 1
        fi
        printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

    - name: Validate project
      shell: bash
      env:
        VALIDATE_COMMAND: ${{ inputs.validate-command }}
      run: bash -euo pipefail -c "$VALIDATE_COMMAND"

    - name: Package reproducible source archive
      shell: bash
      env:
        PACKAGE_PATHS: ${{ inputs.package-paths }}
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        paths=()
        while IFS= read -r path; do
          [[ -z "$path" ]] || paths+=("$path")
        done <<< "$PACKAGE_PATHS"
        if [[ "${#paths[@]}" -eq 0 ]]; then
          echo "package-paths must contain at least one path" >&2
          exit 1
        fi
        asset="$PROJECT_NAME-$VERSION.tar.gz"
        python3 "$GITHUB_ACTION_PATH/../../scripts/package_release.py" \
          --name "$PROJECT_NAME" \
          --version "$VERSION" \
          --output "dist/$asset" \
          "${paths[@]}"
        (cd dist && shasum -a 256 "$asset" > "$asset.sha256")

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ steps.version.outputs.version }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail
        asset="$PROJECT_NAME-$VERSION.tar.gz"
        gh release create "$TAG" \
          "dist/$asset" "dist/$asset.sha256" \
          --target "$GITHUB_SHA" \
          --title "$VERSION" \
          --generate-notes
