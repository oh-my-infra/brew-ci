name: Source release
description: Validate CalVer, package reproducible sources, and optionally create a GitHub Release

inputs:
  publish:
    description: Publish a GitHub Release; false validates and packages twice without publishing
    required: false
    default: "true"
  project-name:
    description: Lowercase project name used in the archive
    required: true
  version-file:
    description: File containing the canonical YYYY.MM.DD.N version
    required: false
    default: VERSION
  validate-command:
    description: Repository command that must pass before packaging
    required: true
  package-paths:
    description: Newline-separated repository-relative paths included in the archive
    required: true

outputs:
  version:
    description: Validated version without the v prefix
    value: ${{ steps.release.outputs.version }}
  tag:
    description: Git tag derived from the version (not created in dry-run mode)
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Validate, package, and optionally release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PUBLISH: ${{ inputs.publish }}
        VERSION_FILE: ${{ inputs.version-file }}
        VALIDATE_COMMAND: ${{ inputs.validate-command }}
        PROJECT_NAME: ${{ inputs.project-name }}
        PACKAGE_PATHS: ${{ inputs.package-paths }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/source_release.sh"
